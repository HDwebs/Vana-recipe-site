<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VANA Recipe Library — Sign In</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/vana-logo-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="gate-screen">
    <div class="gate-card">
      <img src="/assets/vana-logo-colour.png" alt="VANA">
      <h1>Recipe Library</h1>
      <p>This library is exclusive to VANA members. Enter your access password to continue.</p>
      <form id="gate-form">
        <input type="password" id="password" name="password" placeholder="Access password" autocomplete="current-password" required autofocus>
        <button type="submit">Enter</button>
      </form>
      <div class="gate-error" id="gate-error"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("gate-form");
    const errorBox = document.getElementById("gate-error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/.netlify/functions/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (data.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/";
        } else {
          errorBox.textContent = data.error || "Incorrect password. Please try again.";
        }
      } catch (err) {
        errorBox.textContent = "Something went wrong. Please try again.";
      }
    });
  </script>
</body>
</html>
